name: build roothide
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive
      - name: Cache iPhoneOS SDK
        id: sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: kayoko-theos-sdks-16.5
      - name: Download iPhoneOS SDK
        if: steps.sdks.outputs.cache-hit != 'true'
        run: |
          curl -fL -o sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q sdks.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf sdks.zip sdks-master
      - name: Configure toolchain
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build roothide package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: roothide-package
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
